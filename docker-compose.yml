version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: rag-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
      - ./data:/app/data
      - ./benchmark_results:/app/benchmark_results
      - ./tests:/app/tests
    depends_on:
      - qdrant
    networks:
      - rag-net

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-net

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: rag-streamlit
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - rag-net

  react:
    build:
      context: .
      dockerfile: docker/Dockerfile.react
    container_name: rag-react
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - rag-net

  # Ollama is optional — uncomment if you want to run it inside compose.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: rag-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   networks:
  #     - rag-net

networks:
  rag-net:
    driver: bridge
